services:
  - type: web
    name: printshop-ai-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: printshop-ai-store
          envVarKey: RENDER_EXTERNAL_URL
      - key: HERMES_WRITE_TOOLS_ENABLED
        value: "false"
      - key: MARKETING_IMAGE_PROVIDER
        value: ai_horde

  - type: web
    runtime: static
    name: printshop-ai-store
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist/web
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: printshop-ai-api
          envVarKey: RENDER_EXTERNAL_URL
