services:
  - type: web
    name: inkora-n8n
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/n8n/Dockerfile
    dockerContext: ./
    healthCheckPath: /healthz
    initialDeployHook: /opt/inkora/import-workflows.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: GENERIC_TIMEZONE
        value: Africa/Cairo
      - key: TZ
        value: Africa/Cairo
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SCHEMA
        value: inkora_n8n
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      # Trust Supabase's database CA instead of disabling TLS certificate checks.
      - key: DB_POSTGRESDB_SSL_CA_FILE
        value: /opt/inkora/supabase-ca.crt
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "2"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: database
      - key: INKORA_API_BASE_URL
        value: https://printshop-ai.shabara123456.workers.dev

  - type: web
    name: inkora-hermes
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/hermes/Dockerfile
    dockerContext: ./deploy/hermes
    # Keep the official s6 supervision enabled; -v sends startup diagnostics
    # to Render logs while we troubleshoot the failed Hermes boot.
    dockerCommand: gateway run -v
    healthCheckPath: /health
    envVars:
      - key: HERMES_HOME
        value: /opt/data
      - key: HERMES_WRITE_SAFE_ROOT
        value: /opt/data
      - key: API_SERVER_MODEL_NAME
        value: inkora-hermes
      - key: API_SERVER_ENABLED
        value: "true"
      - key: API_SERVER_HOST
        value: 0.0.0.0
      - key: API_SERVER_PORT
        value: "10000"
      - key: GOOGLE_API_KEY
        sync: false
      - key: API_SERVER_KEY
        sync: false
      - key: HERMES_TOOL_API_KEY
        sync: false
